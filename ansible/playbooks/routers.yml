# Configures the routers
- name: Configure OpenWRT Router
  hosts: router
  gather_facts: false
  vars:
    secrets: "{{ lookup('community.sops.sops', 'sops_secrets.yaml') | from_yaml }}"
    wifi_password: "{{ secrets.wifi_password }}"

    wifi_devices:
      - device: radio0
        band: '5g'
        channel: '36'
      - device: radio1
        band: '2g'
        channel: '1'
    wifi_interfaces:
      - network: vpn
        ssid: jonathan-vpn
      - network: direct
        ssid: jonathan-direct
  roles:
    - role: gekmihesg.openwrt
  tasks:
    - name: Ensure required packages are installed
      community.general.opkg:
        name: "{{ item }}"
        state: present
      loop:
        - luci
        - luci-app-firewall
        - luci-proto-wireguard
        - wireguard-tools
        - tcpdump

    ############################################################################
    ### VLANs
    ############################################################################

    - name: Configure switch
      uci:
        command: section
        config: network
        type: switch
        name: switch0
        find:
          name: switch0
        value:
          reset: '1'
          enable_vlan: '1'

    - name: Configure each VLAN
      uci:
        command: section
        config: network
        name: "{{ item.name }}_vlan"
        type: switch_vlan
        find:
          device: switch0
          vlan: "{{ item.vlanId }}"
        value:
          vid: "{{ item.vlanId }}"
          description: "{{ item.description }}"
          ports: "{{ ports }}"
      loop: "{{ subnets.networks.values() }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        wan_ports: '0t 1'
        internal_ports: '0t 2 3 4 5'
        internal_tagged_ports: '0t 2t 3t 4t 5t'

        ports: >-
          {{
            wan_ports
              if item.gatewayPolicy == 'uplink' else
            internal_tagged_ports
              if item.vlan_tagged | default(true) else
            internal_ports
          }}

    ############################################################################
    ### Devices
    ############################################################################

    - name: Configure bridge devices for each VLAN
      uci:
        command: section
        config: network
        type: device
        name: "br_{{ item.name }}"
        find:
          ports: "eth0.{{ item.vlanId }}"
        value:
          name: "br_{{ item.name }}"
          type: 'bridge'
          ipv6: '0'
      loop: "{{ subnets.networks.values() }}"
      loop_control:
        label: "{{ item.name }}"

    ############################################################################
    ### Interfaces
    ############################################################################

    - name: Configure interfaces
      uci:
        command: section
        config: network
        type: interface
        name: "{{ item.name }}"
        find:
          device: "br_{{ item.name }}"
        value:
          proto: "{{ protocol }}"
          ipaddr: "{{ ipaddr }}"
          peerdns: '0'
          dns:
            - "{{ hostvars['mars']['ansible_host'] }}"
      loop: "{{ subnets.networks.values() }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        protocol: >-
          {{
            'dhcp'
              if item.gatewayPolicy == 'uplink' else
            'static'
          }}
        ipaddr: >-
          {{
            item.gatewayCidr | default('')
          }}

    - name: Configure Wireguard Interface
      uci:
        command: section
        config: network
        name: protonvpn
        type: interface
        value:
          proto: wireguard
          private_key: "{{ secrets.proton_vpn_usco50_private_key }}"
          addresses:
            - '10.2.0.2/32'
          # dns: '10.2.0.1'
          dns:
            - "{{ hostvars['mars']['ansible_host'] }}"

    - name: Configure WireGuard peer
      uci:
        command: section
        config: network
        name: wireguard_protonvpn_peers
        type: wireguard_protonvpn
        find:
          description: 'US-CO#50'
        value:
          public_key: 'z54+LsnV9L6PyS/MO4dPfJ650jiOVLVevYrWf2WsDzg='
          endpoint_host: '212.102.44.166'
          endpoint_port: '51820'
          allowed_ips: '0.0.0.0/0'
          persistent_keepalive: '25'

    ############################################################################
    ### DHCP
    ############################################################################

    - name: DHCP for each interface
      uci:
        command: section
        config: dhcp
        type: dhcp
        name: "{{ item.name }}"
        find:
          interface: "{{ item.name }}"
        value:
          start: '100'
          limit: '150'
          leasetime: '12h'
      loop: "{{ subnets.networks.values() }}"
      loop_control:
        label: "{{ item.name }}"

    ############################################################################
    ### Routing
    ############################################################################

    - name: Add vpn_table to routing table definitions
      ansible.builtin.lineinfile:
        path: /etc/iproute2/rt_tables
        line: "200 vpn_table"
        create: true
        state: present
        mode: '0644'

    - name: Create VPN routing rule for all interfaces with the vpn gateway policy
      uci:
        command: section
        config: network
        type: rule
        name: "{{ item.name }}_rule"
        value:
          in: "{{ item.name }}"
          lookup: vpn_table
          priority: '100'
      loop: "{{ subnets.networks.values() }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.gatewayPolicy == 'vpn'

    - name: Create VPN routing table default route
      uci:
        command: section
        config: network
        type: route
        name: vpn_default
        value:
          interface: protonvpn
          target: '0.0.0.0/0'
          table: vpn_table

    - name: Add local network routes to VPN table
      uci:
        command: section
        config: network
        type: route
        name: vpn_local_routes
        value:
          interface: lan
          target: 192.168.0.0/16
          table: vpn_table

    ############################################################################
    ### Wifi
    ############################################################################

    - name: Configure wifi device
      tags: wifi
      uci:
        command: set
        key: "{{ wifi_key }}"
        value:
          type: 'mac80211'
          band: "{{ wifi.band }}"
          channel: "{{ wifi.channel }}"
          disabled: '0'
      loop: "{{ wifi_devices }}"
      loop_control:
        loop_var: wifi
        label: "{{ wifi_key }}"
      vars:
        wifi_key: "wireless.{{ wifi.device }}"

    - name: Configure wifi interface
      tags: wifi
      uci:
        command: section
        config: wireless
        type: wifi-iface
        name: "{{ wifi_name }}"
        value:
          device: "{{ wifi_device.device }}"
          network: "{{ wifi_interface.network }}"
          mode: 'ap'
          ssid: "{{ wifi_interface.ssid }}"
          encryption: 'psk2'
          disabled: '0'
      loop: "{{ wifi_interfaces | product(wifi_devices) }}"
      loop_control:
        loop_var: wifi
        label: "{{ wifi_name }}"
      vars:
        wifi_interface: "{{ wifi[0] }}"
        wifi_device: "{{ wifi[1] }}"

        wifi_name: "{{ wifi_interface.network }}_{{ wifi_device.device }}"

    - name: Set wifi password
      tags: wifi
      uci:
        command: set
        key: "{{ wifi_key }}"
        value:
          key: "{{ wifi_password }}"
      loop: "{{ wifi_interfaces | product(wifi_devices) }}"
      loop_control:
        loop_var: wifi
        label: "{{ wifi_key }}"
      vars:
        wifi_interface: "{{ wifi[0] }}"
        wifi_device: "{{ wifi[1] }}"

        wifi_key: "wireless.{{ wifi_interface.network }}_{{ wifi_device.device }}"
      no_log: true

    ############################################################################
    ### Firewall
    ############################################################################

    - name: Create each zone
      tags: firewall
      uci:
        command: section
        config: firewall
        type: zone
        name: "{{ item.name }}"
        find:
          name: "{{ item.name }}"
        value:
          network: "{{ networks }}"
          input: "{{ input }}"
          output: ACCEPT
          forward: "{{ forward }}"
          masq: "{{ masq }}"
          mtu_fix: "{{ mtu_fix }}"
      loop: "{{ subnets.zones.values() }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        egress: "{{ item.egress | default(false) }}"
        input: "{{ 'REJECT' if egress else 'ACCEPT' }}"
        forward: "{{ 'REJECT' if egress else 'ACCEPT' }}"
        masq: "{{ '1' if egress else '0' }}"
        mtu_fix: "{{ '1' if egress else '0' }}"

        # All subnets with the zone property that matches this item.name
        networks: >-
          {{
            subnets.networks.values()
              | selectattr('zone', 'equalto', item.name)
              | map(attribute='name')
              | list
              + item.extra_networks | default([])
          }}

    - name: Allow forwarding between zones
      tags: firewall
      uci:
        command: section
        config: firewall
        type: forwarding
        name: "{{ item.src }}_{{ item.dest }}"
        value:
          src: "{{ item.src }}"
          dest: "{{ item.dest }}"
      loop: "{{ subnets.forwarding_rules }}"

    - name: Force outgoing vpn traffic through proton
      tags: firewall
      uci:
        command: section
        config: firewall
        type: redirect
        name: "{{ item.name }}_redirect"
        value:
          name: "{{ item.name }}_redirect"
          src: "{{ item.name }}"
          dest: protonvpn
          proto: 'tcp udp'
          src_dport: '1-65535'
          dest_ip: '!192.168.0.0/16'  # Don't redirect local traffic
          target: DNAT
      loop: "{{ subnets.networks.values() }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.gatewayPolicy == 'vpn'

    - name: Block direct WAN access from outgoing vpn zones
      tags: firewall
      uci:
        command: section
        config: firewall
        type: rule
        name: "block_{{ item.name }}_wan"
        value:
          name: "Block-{{ item.name }}-WAN"
          src: "{{ item.name }}"
          dest: wan
          target: REJECT
      loop: "{{ subnets.networks.values() }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.gatewayPolicy == 'vpn'

    ############################################################################
    ### Commit changes
    ############################################################################

    - name: Commit UCI changes
      tags: always
      when: not (no_commit | default(false) | bool)
      uci:
        command: commit
      notify: reload wifi
